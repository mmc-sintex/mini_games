<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniVerse | مجموعه مینی‌گیم</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="badge">MINIVERSE</div>

  <h1>۱۰ مینی‌گیم خلاقانه 🎮</h1>

  <p>
    هر بازی یک تجربه‌ی کوتاه و مستقل؛
    بدون نصب و مستقیم داخل مرورگر.
  </p>
</header>

<main>

<section id="home">

  <div id="gameGrid" class="grid"></div>

  <div class="support">

    <h2>❤️ حمایت از مجموعه</h2>

    <p>
      اگر از بازی‌ها خوشت اومد،
      می‌تونی از ادامه‌ی توسعه حمایت کنی.
    </p>

    <!-- لینک واقعی دونیت خودت را اینجا قرار بده -->
    <a
      href="https://example.com/donate"
      target="_blank"
      rel="noopener"
      class="donate"
    >
      حمایت و دونیت
    </a>

  </div>

</section>


<section id="play" class="hidden">

  <div class="toolbar">

    <button id="back" class="btn">
      ← بازگشت
    </button>

    <div>
      <h2 id="title"></h2>
      <small id="description"></small>
    </div>

    <button id="restart" class="btn">
      ↻ دوباره
    </button>

  </div>

  <div id="game" class="game-area"></div>

</section>

</main>

<footer>
  MiniVerse — ساخته‌شده برای اجرا روی GitHub Pages
</footer>

<script src="app.js"></script>

</body>
</html>
